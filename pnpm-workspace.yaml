# Dependency nào được chạy script cài đặt (postinstall). Mặc định pnpm chặn hết; chỉ cho phép khi thật sự cần.
# esbuild: do vitest dùng để biên dịch TypeScript. protobufjs: script postinstall chỉ phục vụ CLI của nó, thư viện không cần.
allowBuilds:
  esbuild: true
  protobufjs: false
overrides:
  gcp-metadata: ^9.2.3 # dùng gaxios 8, không còn rimraf → glob → minimatch 9
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.1

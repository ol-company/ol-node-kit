# CI + phát hành thư viện @ol-company/node-kit lên GitHub Packages.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: ol-company/ol-build-tooling/.github/workflows/node-ci.yml@5a241c28edd1f33f19e4144323d49395ece4aaf3 # v1.0.0
    permissions:
      contents: read
      packages: read

  security:
    uses: ol-company/ol-build-tooling/.github/workflows/security-scan.yml@5a241c28edd1f33f19e4144323d49395ece4aaf3 # v1.0.0
    permissions:
      contents: read
      security-events: write
      packages: read
      pull-requests: write

  release:
    if: github.event_name == 'push'
    needs: [ci, security]
    uses: ol-company/ol-build-tooling/.github/workflows/release.yml@5a241c28edd1f33f19e4144323d49395ece4aaf3 # v1.0.0
    secrets: inherit
    permissions:
      contents: read

  # Chỉ publish khi release-please vừa tạo phiên bản mới (merge release PR)
  publish:
    needs: release
    if: needs.release.outputs.release-created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # Ghi package vào GitHub Packages của org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
